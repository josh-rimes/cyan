name: login
namespace: aws
version: 1.0.0
description: Authenticate the AWS CLI using an access key and secret, then verify identity.
parameters:
  aws_access_key_id:
    type: string
    required: true
  aws_secret_access_key:
    type: string
    required: true
  region:
    type: string
    required: false
    default: us-east-1
script:
  - "aws configure set aws_access_key_id {{aws_access_key_id}}"
  - "aws configure set aws_secret_access_key {{aws_secret_access_key}}"
  - "aws configure set region {{region}}"
  - "aws sts get-caller-identity"
